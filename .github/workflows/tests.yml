name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q -m 'not integration'

  reid-patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BoT-SORT only
        run: git submodule update --init baselines/BoT-SORT
      - name: Validate both sequential patches against pinned source
        run: |
          git -C baselines/BoT-SORT apply --check ../../patches/botsort-reid-compat.patch
          git -C baselines/BoT-SORT apply ../../patches/botsort-reid-compat.patch
          git -C baselines/BoT-SORT apply --check ../../patches/botsort-lazy-fastreid.patch
          git -C baselines/BoT-SORT apply ../../patches/botsort-lazy-fastreid.patch
          python -m py_compile baselines/BoT-SORT/tracker/bot_sort.py


  botsort-reid-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Fetch pinned BoT-SORT source
        run: git submodule update --init baselines/BoT-SORT
      - name: Install minimal runtime dependencies without a model
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install "matplotlib==3.10.9" "lap==0.5.13" "filterpy==1.4.5"
          python -m pip install "Cython==0.29.37" "setuptools" "wheel"
          python -m pip install --no-build-isolation "cython-bbox==0.1.5"
      - name: Apply pinned compatibility patches
        run: |
          bash scripts/apply_botsort_compatibility_patch.sh
          bash scripts/apply_botsort_reid_patch.sh
      - name: Real tracker import and appearance association integration test
        run: python -m pytest -v -m integration tests/test_botsort_reid_bridge.py
